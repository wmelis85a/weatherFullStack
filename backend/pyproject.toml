    "colorama (==0.4.6)",
    "dnspython (==2.7.0)",
    "email-validator (==2.2.0)",
    "fastapi (==0.115.12)",
    "gunicorn (==23.0.0)",
    "h11 (==0.14.0)",
    "httpcore (==1.0.8)",
    "httpx (==0.28.1)",
    "idna (==3.10)",
    "packaging (==25.0)",
    "pydantic (==2.11.3)",
    "pydantic-core (==2.33.1)",
    "python-dotenv (==1.1.0)",
    "python-multipart (==0.0.20)",
    "ruff (==0.13.1)",
